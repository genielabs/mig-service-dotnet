name: Build and publish MIG

on:
  push:
    branches: [master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (for example 1.3.12); leave empty for a build only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mig-service-dotnet-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Determine package version
        id: version
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUESTED_RELEASE_TAG) {
            $version = $env:REQUESTED_RELEASE_TAG -replace '^v', ''
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "1.3.0-preview.ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:REQUESTED_RELEASE_TAG) {
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
              throw 'Expected a tag such as v1.3.12 or v1.3.12-preview.1'
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(($version -match '-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build
        run: dotnet build MIG.sln -c Release
      - name: Unit tests
        run: dotnet test MIG.Tests/MIG.Tests.csproj -c Release --no-build
      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack MIG/MIG.csproj -c Release --output artifacts /p:Version=$env:PACKAGE_VERSION /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build]
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: NuGet login with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: G-Labs
      - name: Publish package and symbols to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $package = @(Get-ChildItem -LiteralPath artifacts -Filter 'MIG.*.nupkg')
          $symbols = @(Get-ChildItem -LiteralPath artifacts -Filter 'MIG.*.snupkg')
          if ($package.Count -ne 1 -or $symbols.Count -ne 1) {
            throw 'Expected exactly one NuGet package and one symbol package'
          }
          dotnet nuget push $package[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push $symbols[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:GH_REPO --clobber
          } else {
            $releaseArgs = @('release', 'create', $env:RELEASE_TAG) + $assets + @('--repo', $env:GH_REPO, '--verify-tag', '--title', "MIG $env:RELEASE_TAG", '--notes', 'Multi-protocol network and real-time services for .NET. See README and commit history for details.')
            if ($env:IS_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
