version: 1.3.{build}
image: Visual Studio 2022

install:
  - ps: Invoke-WebRequest -UseBasicParsing -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
  - ps: .\dotnet-install.ps1 -Channel 10.0 -InstallDir 'C:\Program Files\dotnet'

configuration: Release

before_build:
  - dotnet restore MIG.sln

build_script:
  - dotnet build MIG.sln -c Release --no-restore

test_script:
  - dotnet test MIG.Tests/MIG.Tests.csproj -c Release --no-build
after_test:
  - ps: .\MIG\nuget_pack.ps1
artifacts:
  - path: '*.nupkg'
    name: MIG nupkg
deploy: off
